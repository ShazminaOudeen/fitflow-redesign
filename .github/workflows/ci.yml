name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required documentation exists
        run: |
          test -f README.md
          test -f docs/tech-stack-summary.md
          test -f docs/comparison-matrix.md
          test -f docs/adr/ADR-001-technology-stack.md
          test -f docs/architecture/architecture-diagram.png
